{{ define "main" }}
<section class="hero" style="border-bottom:none; padding-bottom:0;">
  <div class="wrap" style="max-width:760px;">
    <span class="eyebrow">{{ .Params.rubrique }}</span>
    <h1>{{ .Title }}</h1>
    <div class="byline" style="margin-bottom:8px;">
      <span><strong>Par {{ .Params.author }}</strong></span>
      <span>{{ .Date.Format "02/01/2006" }}</span>
      <span>{{ .Params.readingTime }}</span>
    </div>
  </div>
</section>
<article class="article-body">
  <div class="wrap" style="max-width:760px;">
    {{ .Content }}
  </div>
</article>
{{ end }}
