<div class="topbar">
  <div class="wrap">
    <span>{{ upper .Site.Title }} — FONDÉE EN 2026</span>
  </div>
</div>

<header class="masthead">
  <div class="wrap">
    <div class="nameplate-row">
      <div class="logo-badge">
        <img src="{{ "images/logo.png" | relURL }}" alt="Logo {{ .Site.Title }}">
      </div>
      <a href="{{ site.Home.RelPermalink }}" class="nameplate">{{ .Site.Title }}</a>
    </div>
  </div>
</header>

<nav class="mainnav">
  <div class="wrap">
    <ul>
      {{ range .Site.Params.rubriques }}
        {{ $page := site.GetPage (printf "rubriques/%s" (. | urlize)) }}
        {{ if $page }}
        <li><a href="{{ $page.RelPermalink }}">{{ . }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
  </div>
</nav>
